[pytest]
testpaths = HMS_py/tests tests
norecursedirs = FODER .venv .git build dist __pycache__ demo_screenshots .pytest_cache
addopts = --tb=short
markers =
    unit: Unit tests (fast, no DB)
    integration: Integration tests (with DB)
    database: Database tests (schema, CRUD)
    regression: Full regression tests
    slow: Slow tests (>5s)
    vb6_compare: Tests comparing VB6 vs Python behavior
