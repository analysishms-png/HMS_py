# HMS_py CI — pytest (Qt offscreen) on every push
#
# Tests DB-free design pe hain (unit + UI walkthroughs) — SQL Server
# ki zaroorat NAHI. PyQt6 offscreen platform pe render hota hai.
#
# Runner note: windows-latest dev environment (win32) se match karta hai
# aur PyQt6 ke liye koi extra system packages nahi mangta. Linux chahiye
# to ubuntu-latest + ye step add karo (PyQt6 system libs):
#   - name: Install Qt system libs
#     run: sudo apt-get update && sudo apt-get install -y
#       libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
name: CI

on:
  push:
    branches: ["**"]        # har push pe chale (sab branches)
  pull_request:
  workflow_dispatch:         # manual trigger bhi available

jobs:
  pytest-offscreen:
    name: pytest (Qt offscreen)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: HMS_py/pyproject.toml

      - name: Install dependencies
        # pins HMS_py/pyproject.toml se mirror (drift avoid)
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt6==6.7.1" "pyodbc==5.1.0" "pytest>=7.4.0"

      - name: Import smoke test
        run: python -c "from HMS_py.ui import theme, glass, shell; print('UI imports OK')"

      - name: Run test suite
        run: python -m pytest -q --tb=short

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: demo_screenshots/
          if-no-files-found: ignore
